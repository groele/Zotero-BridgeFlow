  <circle cx="48" cy="21" r="4" fill="#CCFBF1"/>
  <path d="M21 21 H43" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round" stroke-opacity="0.75"/>
