<!-- Zotero BridgeFlow settings. Tabbed layout with guided banners & 2-column grid. -->
<linkset>
	<html:link rel="localization" href="zotero-bridgeflow.ftl"/>
</linkset>

<vbox id="zotero-prefpane-zotero-bridgeflow" class="zbf-settings">
	<html:header class="zbf-header">
		<html:div class="zbf-title-row">
			<html:h1 data-l10n-id="zbf-prefs-title"></html:h1>
			<html:span id="zbf-version-badge" class="zbf-version-badge" data-l10n-id="zbf-prefs-version" data-l10n-args='{"version":"0.0.4"}'>v0.0.4</html:span>
		</html:div>
		<html:p class="zbf-subtitle" data-l10n-id="zbf-prefs-subtitle"></html:p>
	</html:header>

	<!-- Top Tab Navigation -->
	<html:nav class="zbf-tabs" role="tablist">
		<html:button type="button" class="zbf-tab-btn active" role="tab" aria-selected="true" data-zbf-tab="overview" data-l10n-id="zbf-tab-overview"></html:button>
		<html:button type="button" class="zbf-tab-btn" role="tab" aria-selected="false" data-zbf-tab="workspace" data-l10n-id="zbf-tab-workspace"></html:button>
		<html:button type="button" class="zbf-tab-btn" role="tab" aria-selected="false" data-zbf-tab="sidebar" data-l10n-id="zbf-tab-sidebar"></html:button>
		<html:button type="button" class="zbf-tab-btn" role="tab" aria-selected="false" data-zbf-tab="csl" data-l10n-id="zbf-tab-csl"></html:button>
		<html:button type="button" class="zbf-tab-btn" role="tab" aria-selected="false" data-zbf-tab="pdf" data-l10n-id="zbf-tab-pdf"></html:button>
		<html:button type="button" class="zbf-tab-btn" role="tab" aria-selected="false" data-zbf-tab="word" data-l10n-id="zbf-tab-word"></html:button>
	</html:nav>

	<!-- Tab 1: Overview & Cross-Domain Fusion -->
	<html:section class="zbf-tabpanel" data-zbf-panel="overview">
		<html:div class="zbf-banner">
			<html:div class="zbf-banner-title" data-l10n-id="zbf-banner-overview-title"></html:div>
			<html:div class="zbf-banner-desc" data-l10n-id="zbf-banner-overview-desc"></html:div>
			<html:div class="zbf-steps">
				<html:span class="zbf-step" data-l10n-id="zbf-step-1"></html:span>
				<html:span class="zbf-step" data-l10n-id="zbf-step-2"></html:span>
				<html:span class="zbf-step" data-l10n-id="zbf-step-3"></html:span>
			</html:div>
		</html:div>

		<html:h2 class="zbf-section-title" data-l10n-id="zbf-sec-master-modules"></html:h2>
		<html:div class="zbf-grid-1">
			<checkbox preference="extensions.zotero.bridgeflow.modules.workspace.enable" native="true" data-l10n-id="zbf-pref-mod-workspace"/>
			<checkbox preference="extensions.zotero.bridgeflow.modules.inspector.enable" native="true" data-l10n-id="zbf-pref-mod-inspector"/>
			<checkbox preference="extensions.zotero.bridgeflow.modules.wordCite.enable" native="true" data-l10n-id="zbf-pref-mod-wordcite"/>
		</html:div>

		<html:h2 class="zbf-section-title" data-l10n-id="zbf-sec-fusion"></html:h2>
		<html:div class="zbf-grid-2">
			<checkbox preference="extensions.zotero.bridgeflow.fusion.copyToLookupHistory" native="true" data-l10n-id="zbf-pref-fusion-copy-history"/>
			<checkbox preference="extensions.zotero.bridgeflow.fusion.sidebarCiteBadge" native="true" data-l10n-id="zbf-pref-fusion-sidebar-badge"/>
			<checkbox preference="extensions.zotero.bridgeflow.fusion.spotlightCrossDomain" native="true" data-l10n-id="zbf-pref-fusion-spotlight"/>
			<checkbox preference="extensions.zotero.bridgeflow.fusion.lookupJumpExistingTab" native="true" data-l10n-id="zbf-pref-fusion-lookup-jump"/>
		</html:div>

		<html:h2 class="zbf-section-title" data-l10n-id="zbf-sec-maintenance"></html:h2>
		<html:div class="zbf-grid-1">
			<checkbox preference="extensions.zotero.bridgeflow.debug" native="true" data-l10n-id="zbf-pref-debug"/>
			<html:div class="zbf-actions">
				<button id="zbf-clear-cache" native="true" data-l10n-id="zbf-btn-clear-cache"/>
				<button id="zbf-reset-defaults" native="true" data-l10n-id="zbf-btn-reset-defaults"/>
			</html:div>
		</html:div>
	</html:section>

	<!-- Tab 2: Tabs & Workspace -->
	<html:section class="zbf-tabpanel" data-zbf-panel="workspace" hidden="hidden">
		<html:div class="zbf-banner">
			<html:div class="zbf-banner-title" data-l10n-id="zbf-banner-workspace-title"></html:div>
			<html:div class="zbf-banner-desc" data-l10n-id="zbf-banner-workspace-desc"></html:div>
		</html:div>

		<html:div id="zbf-group-workspace">
			<html:h2 class="zbf-section-title" data-l10n-id="zbf-sec-tab-layout"></html:h2>
			<html:div class="zbf-grid-2">
				<html:div class="zbf-cell">
					<checkbox preference="extensions.zotero.bridgeflow.workspace.enableHorizontalGroups" native="true" data-l10n-id="zbf-pref-ws-horizontal"/>

						<label data-l10n-id="zbf-pref-ws-hcompact" control="zbf-sel-hcompact"></label>
						<menulist id="zbf-sel-hcompact" native="true" preference="extensions.zotero.bridgeflow.workspace.horizontalTabCompactMode">
							<menupopup>
								<menuitem value="auto" data-l10n-id="zbf-opt-auto"/>
								<menuitem value="compact" data-l10n-id="zbf-opt-compact"/>
								<menuitem value="normal" data-l10n-id="zbf-opt-normal"/>
							</menupopup>
						</menulist>
					</html:div>
					<html:div id="zbf-sub-compactTop" class="zbf-sub-stack">
						<checkbox preference="extensions.zotero.bridgeflow.workspace.compactTopBar" native="true" data-l10n-id="zbf-pref-ws-compact-topbar"/>
					</html:div>
				</html:div>

				<html:div class="zbf-cell">
					<checkbox preference="extensions.zotero.bridgeflow.workspace.enableVerticalSidebar" native="true" data-l10n-id="zbf-pref-ws-vertical"/>
					<html:div id="zbf-sub-batch" class="zbf-sub-stack">
						<checkbox preference="extensions.zotero.bridgeflow.workspace.enableBatchSelection" native="true" data-l10n-id="zbf-pref-ws-batch"/>
					</html:div>
				</html:div>

				<html:div class="zbf-cell">
					<checkbox preference="extensions.zotero.bridgeflow.workspace.enablePinnedTabs" native="true" data-l10n-id="zbf-pref-ws-pinned"/>
					<html:div id="zbf-sub-pinnedIcon" class="zbf-sub-stack">
						<checkbox preference="extensions.zotero.bridgeflow.workspace.pinnedIconOnly" native="true" data-l10n-id="zbf-pref-ws-pinned-icon"/>
					</html:div>
				</html:div>

				<html:div class="zbf-cell">
					<checkbox preference="extensions.zotero.bridgeflow.workspace.enableVirtualMembers" native="true" data-l10n-id="zbf-pref-ws-virtual"/>
				</html:div>
			</html:div>

			<html:h2 class="zbf-section-title" data-l10n-id="zbf-sec-grouping-sleep"></html:h2>
			<html:div class="zbf-grid-2">
				<html:div class="zbf-cell">
					<html:div class="zbf-inline-field">
						<label data-l10n-id="zbf-pref-ws-newtab-mode" control="zbf-sel-newtab"></label>
						<menulist id="zbf-sel-newtab" native="true" preference="extensions.zotero.bridgeflow.workspace.newTabMode">
							<menupopup>
								<menuitem value="independent" data-l10n-id="zbf-opt-independent"/>
								<menuitem value="collection" data-l10n-id="zbf-opt-collection"/>
							</menupopup>
						</menulist>
					</html:div>
					<html:div id="zbf-sub-multicol" class="zbf-sub-row">
						<label data-l10n-id="zbf-pref-ws-multicol" control="zbf-sel-multicol"></label>
						<menulist id="zbf-sel-multicol" native="true" preference="extensions.zotero.bridgeflow.workspace.multiCollectionStrategy">
							<menupopup>
								<menuitem value="active" data-l10n-id="zbf-opt-active"/>
								<menuitem value="existing" data-l10n-id="zbf-opt-existing"/>
								<menuitem value="first" data-l10n-id="zbf-opt-first"/>
							</menupopup>
						</menulist>
					</html:div>
				</html:div>

				<html:div class="zbf-cell">
					<checkbox preference="extensions.zotero.bridgeflow.workspace.enableSessions" native="true" data-l10n-id="zbf-pref-ws-sessions"/>
					<html:div id="zbf-sub-rolling" class="zbf-sub-stack">
						<checkbox preference="extensions.zotero.bridgeflow.workspace.enableRollingSnapshots" native="true" data-l10n-id="zbf-pref-ws-rolling"/>
					</html:div>
				</html:div>

				<html:div class="zbf-cell">
					<checkbox preference="extensions.zotero.bridgeflow.workspace.enableTabSleep" native="true" data-l10n-id="zbf-pref-ws-sleep"/>
					<html:div id="zbf-sub-sleep-cfg" class="zbf-sub-stack">
						<html:div class="zbf-inline-field">
							<label data-l10n-id="zbf-pref-ws-autosleep" control="zbf-num-autosleep"></label>
							<html:input id="zbf-num-autosleep" class="zbf-num-input" type="number" min="0" max="1440" data-zbf-pref="workspace.autoSleepMinutes"/>
						</html:div>
						<html:div class="zbf-inline-field">
							<label data-l10n-id="zbf-pref-ws-budget" control="zbf-num-budget"></label>
							<html:input id="zbf-num-budget" class="zbf-num-input" type="number" min="0" max="100" data-zbf-pref="workspace.activeReaderBudget"/>
						</html:div>
					</html:div>
				</html:div>

				<html:div class="zbf-cell">
					<checkbox preference="extensions.zotero.bridgeflow.workspace.enableStaleSuggestions" native="true" data-l10n-id="zbf-pref-ws-stale"/>
					<html:div id="zbf-sub-stale-days" class="zbf-sub-row">
						<label data-l10n-id="zbf-pref-ws-stale-days" control="zbf-num-staledays"></label>
						<html:input id="zbf-num-staledays" class="zbf-num-input" type="number" min="1" max="3650" data-zbf-pref="workspace.staleSuggestDays"/>
					</html:div>
				</html:div>
			</html:div>
		</html:div>
	</html:section>

	<!-- Tab 3: Sidebar Typography & Context Menus -->
	<html:section class="zbf-tabpanel" data-zbf-panel="sidebar" hidden="hidden">
		<html:div class="zbf-banner">
			<html:div class="zbf-banner-title" data-l10n-id="zbf-banner-sidebar-title"></html:div>

		</html:div>

			<html:div class="zbf-grid-2">

						</menulist>

				</html:div>

				<html:div class="zbf-cell">
					<checkbox preference="extensions.zotero.bridgeflow.workspace.enableHoverPreview" native="true" data-l10n-id="zbf-pref-ws-hover"/>
					<checkbox preference="extensions.zotero.bridgeflow.workspace.enableSpotlight" native="true" data-l10n-id="zbf-pref-ws-spotlight"/>
				</html:div>

				<html:div class="zbf-cell">
					<html:div class="zbf-inline-field">
						<label data-l10n-id="zbf-pref-ws-title-mode" control="zbf-sel-titlemode"></label>
						<menulist id="zbf-sel-titlemode" native="true" preference="extensions.zotero.bridgeflow.workspace.verticalTabTitleMode">
							<menupopup>
								<menuitem value="title" data-l10n-id="zbf-opt-full-title"/>
								<menuitem value="shortTitle" data-l10n-id="zbf-opt-short-title"/>
								<menuitem value="filename" data-l10n-id="zbf-opt-filename"/>
							</menupopup>
						</menulist>
					</html:div>
					<html:div class="zbf-inline-field">
						<label data-l10n-id="zbf-pref-ws-sub-mode" control="zbf-sel-submode"></label>
						<menulist id="zbf-sel-submode" native="true" preference="extensions.zotero.bridgeflow.workspace.verticalTabSubtitleMode">
							<menupopup>
								<menuitem value="source" data-l10n-id="zbf-opt-sub-source"/>
								<menuitem value="creatorYear" data-l10n-id="zbf-opt-sub-creator"/>
								<menuitem value="collection" data-l10n-id="zbf-opt-sub-col"/>
								<menuitem value="none" data-l10n-id="zbf-opt-sub-none"/>
							</menupopup>
						</menulist>
					</html:div>
				</html:div>

				<html:div class="zbf-cell">
					<html:div class="zbf-inline-field">
						<label data-l10n-id="zbf-pref-ws-row-height" control="zbf-num-rowh"></label>
						<html:input id="zbf-num-rowh" class="zbf-num-input" type="number" min="28" max="72" data-zbf-pref="workspace.verticalTabRowHeight"/>
					</html:div>
					<html:div class="zbf-inline-field">
						<label data-l10n-id="zbf-pref-ws-font-size" control="zbf-num-vfont"></label>
						<html:input id="zbf-num-vfont" class="zbf-num-input" type="number" min="11" max="18" data-zbf-pref="workspace.verticalTabFontSize"/>
					</html:div>
				</html:div>
			</html:div>

			<html:h2 class="zbf-section-title" data-l10n-id="zbf-sec-menus"></html:h2>
			<html:div class="zbf-grid-2">
				<html:div class="zbf-cell">
					<checkbox preference="extensions.zotero.bridgeflow.workspace.enableTabContextMenu" native="true" data-l10n-id="zbf-pref-ws-tabmenu"/>
					<html:div id="zbf-sub-tabmenu" class="zbf-sub-stack">
